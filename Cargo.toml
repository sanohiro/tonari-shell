[package]
name = "tonari"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An experimental Bash-compatible interactive shell for macOS and Linux"
publish = false

[dependencies]
libc = "0.2"
unicode-width = { version = "0.2", default-features = false }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
