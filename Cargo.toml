[package]
name = "tonari"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A Bash-compatible login shell with built-in autosuggestions, history search, and tab completion"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
tz-rs = "0.7.3"
memchr = { version = "2.8", default-features = false }
unicode-width = { version = "0.2", default-features = false }
tonari-time-locales = { path = "crates/time-locales" }
itoa = "1"
foldhash = "0.2.0"
unicode-segmentation = { version = "1", default-features = false }

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
dlmalloc = { version = "0.2.14", features = ["global"] }

[profile.release]
opt-level = 2
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tonari_inherit_sigpipe)'] }
