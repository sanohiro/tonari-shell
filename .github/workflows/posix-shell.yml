name: POSIX sh regression tests
on: pull_request
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        revision: [current, previous]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ matrix.revision == 'previous' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Build the Linux distribution executable
        run: |
          rustup toolchain install "$(sed -n 's/^ *toolchain=//p' tools/build-release.sh)" --profile minimal --component rust-src --target x86_64-unknown-linux-musl
          cp "$(tools/build-release.sh)" "$RUNNER_TEMP/tonari"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shell-${{ matrix.revision }}
          path: ${{ runner.temp }}/tonari
          if-no-files-found: error
          retention-days: 1

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: cargo test --locked
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo test --locked --target x86_64-unknown-linux-musl
      - run: python3 -m unittest discover -s tests/compat -p test_benchmark_helpers.py

  integration:
    strategy:
      fail-fast: false
      matrix:
        reference: [system, gnu-5.3.20]
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: shell-current
          path: bin
      - name: Build pinned GNU Bash
        if: matrix.reference == 'gnu-5.3.20'
        run: |
          source tools/ci/bash-source.sh
          manifest="$PWD/tools/ci/bash53-patches.sha256"
          cd "$RUNNER_TEMP"
          download_bash 5.3 0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba bash.tar.gz
          tar xzf bash.tar.gz
          curl -fsSL --parallel --retry 3 --max-time 120 \
            'https://ftp.gnu.org/gnu/bash/bash-5.3-patches/bash53-[001-020]' -o 'bash53-#1'
          sha256sum -c "$manifest"
          for patch in bash53-???; do patch -s -d bash-5.3 -p0 < "$patch"; done
          cd bash-5.3
          ./configure --without-bash-malloc --disable-nls > "$RUNNER_TEMP/bash-configure.log"
          make -s -j"$(nproc)" > "$RUNNER_TEMP/bash-build.log"
          echo "REFERENCE_BASH=$PWD/bash" >> "$GITHUB_ENV"
      - run: |
          reference=${REFERENCE_BASH:-/bin/bash}
          "$reference" --version
          chmod +x bin/tonari
          REFERENCE_BASH="$reference" python3 tests/shell.py bin/tonari -q
          for suite in tests/review_{builtins,interactive,language,runtime}.py; do
            python3 "$suite" "$PWD/bin/tonari" "$reference"
          done
          python3 tests/compat/source_review.py "$reference" bin/tonari --runs 0

  macos-integration:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check the arm64 release against GNU Bash
        run: |
          rustup toolchain install "$(sed -n 's/^ *toolchain=//p' tools/build-release.sh)" --profile minimal --component rust-src --target aarch64-apple-darwin
          shell=$(tools/build-release.sh)
          reference=$(brew --prefix bash)/bin/bash
          [[ -x $reference ]] || brew install bash
          "$reference" --version
          REFERENCE_BASH="$reference" python3 tests/shell.py "$shell" -q
          for suite in tests/review_{builtins,interactive,language,runtime}.py; do
            python3 "$suite" "$PWD/$shell" "$reference"
          done

  compare:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 25
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: shell-*
          path: bin
      - name: Compare upstream cases
        run: |
          set -euo pipefail
          chmod +x bin/shell-{current,previous}/tonari
          git init -q "$RUNNER_TEMP/yash"
          git -C "$RUNNER_TEMP/yash" fetch -q --depth 1 https://github.com/magicant/yash.git 1cdb509a617894ed96a12c33b43bcd7adb6f1ff5
          git -C "$RUNNER_TEMP/yash" checkout -q --detach FETCH_HEAD
          python3 tools/ci/yash-posix.py "$RUNNER_TEMP/yash" results --prepare --runs 1 --require-bash-passes \
            --tonari "$PWD/bin/shell-current/tonari" --previous "$PWD/bin/shell-previous/tonari" --bash /bin/bash \
            --shard "$SHARD/4" --inventory docs/compatibility/yash-posix/ubuntu-24.04.tsv.gz
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: posix-sh-pr-${{ matrix.shard }}
          path: results/
