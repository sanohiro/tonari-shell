name: POSIX sh regression tests
on: pull_request
permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 25
    env:
      SHARD: ${{ matrix.shard }}
      BASE_REVISION: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build both revisions and compare upstream cases
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_REVISION"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/target"
          (cd "$RUNNER_TEMP/base" && cargo build --locked --release --target-dir "$RUNNER_TEMP/base-target")
          cp "$RUNNER_TEMP/base-target/release/tonari" "$RUNNER_TEMP/previous"
          cargo build --locked --release
          git init -q "$RUNNER_TEMP/yash"
          git -C "$RUNNER_TEMP/yash" fetch -q --depth 1 https://github.com/magicant/yash.git 1cdb509a617894ed96a12c33b43bcd7adb6f1ff5
          git -C "$RUNNER_TEMP/yash" checkout -q --detach FETCH_HEAD
          python3 tools/ci/yash-posix.py "$RUNNER_TEMP/yash" results --prepare --runs 1 --require-bash-passes \
            --tonari "$CARGO_TARGET_DIR/release/tonari" --previous "$RUNNER_TEMP/previous" --bash /bin/bash \
            --shard "$SHARD/4" --inventory docs/compatibility/yash-posix/ubuntu-24.04.tsv.gz
      - name: Check interpreter unit tests
        if: matrix.shard == 0
        run: cargo test --locked
      - name: Check POSIX execution order and terminal operands
        if: matrix.shard == 0
        run: python3 tests/shell.py "$RUNNER_TEMP/target/release/tonari" -q -k posix_
      - name: Run shell and terminal regressions
        if: matrix.shard == 0
        run: |
          python3 tests/shell.py "$RUNNER_TEMP/target/release/tonari" -q
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: posix-sh-pr-${{ matrix.shard }}
          path: results/
