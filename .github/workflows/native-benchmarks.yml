name: Native benchmarks
on:
  workflow_dispatch:
    inputs:
      previous:
        description: Previous revision for the functions and throughput suites
        type: string
        default: HEAD^
      timing_run:
        description: Workflow run whose saved inventory timings should be replayed by budget-extra
        type: string
      matrix:
        description: Native runners and suites to measure
        type: string
        default: '{"runner":["ubuntu-24.04","ubuntu-24.04-arm","macos-15"],"suite":["editing","completion","execution","rcfiles","profiles","inventory"],"include":[{"runner":"ubuntu-24.04","suite":"inventory-ubuntu"},{"runner":"ubuntu-24.04-arm","suite":"inventory-ubuntu"}]}'

permissions:
  contents: read
  actions: read

jobs:
  measure:
    name: ${{ matrix.runner }} / ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      SUITE: ${{ matrix.suite }}
      EXTERNAL_BENCH_CASE: ${{ matrix.case }}
      EXTERNAL_BENCH_RUNS: ${{ matrix.runs }}
      PREVIOUS_REVISION: ${{ inputs.previous }}
      NATIVE_RUNNER: ${{ matrix.runner }}
      TIMING_RUN: ${{ inputs.timing_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record machine and build release
        run: bash tools/ci/native-build.sh
      - name: Retrieve saved timings for an additional replay
        if: startsWith(matrix.suite, 'budget-extra')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $TIMING_RUN =~ ^[0-9]+$ ]]
          source=inventory
          if [[ $SUITE == *-ubuntu ]]; then source=inventory-ubuntu; fi
          gh run download "$TIMING_RUN" -n "$NATIVE_RUNNER-$source" -D "$RUNNER_TEMP/reuse"
      - name: Retrieve original samples for workloads above Bash time
        if: startsWith(matrix.suite, 'budget-parity')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $TIMING_RUN =~ ^[0-9]+$ ]]
          suffix=
          if [[ $SUITE == *-ubuntu ]]; then suffix=-ubuntu; fi
          for suite in budget inventory; do
            gh run download "$TIMING_RUN" -n "$NATIVE_RUNNER-$suite$suffix" -D "$RUNNER_TEMP/reuse/$suite"
          done
      - name: Measure on the native host
        run: bash tools/ci/native-bench.sh
      - name: Preserve measurements and host details
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.runner }}-${{ matrix.suite }}
          path: results/
          if-no-files-found: error
