name: Historical native benchmarks
on: workflow_dispatch

permissions:
  contents: read

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      NATIVE_RUNNER: ${{ matrix.runner }}
      SHARD: ${{ matrix.shard }}
      SUITE: historical
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash tools/ci/native-build.sh
      - run: python3 tools/ci/replay-history.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-${{ matrix.runner }}-${{ matrix.shard }}
          path: results/
